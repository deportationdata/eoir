name: Download and process EOIR data

on:
  workflow_call:
    inputs:
      last_modified:
        required: false
        type: string
        default: ""
      etag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      last_modified:
        required: false
        type: string
        default: ""
      etag:
        required: false
        type: string
        default: ""
      download_url:
        required: false
        type: string
        default: "https://fileshare.eoir.justice.gov/EOIR%20Case%20Data.zip"
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'inputs/**'
      - 'renv.lock'
      - '.github/workflows/clean_release_data.yaml'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: clean-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-and-release:
    runs-on: large-runner

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: r-lib/actions/setup-r@v2

      - name: Install V8 system dependency
        run: sudo apt-get update && sudo apt-get install -y libnode-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Download data
        env:
          DOWNLOAD_URL: ${{ inputs.download_url || 'https://fileshare.eoir.justice.gov/EOIR%20Case%20Data.zip' }}
        run: |
          mkdir -p inputs_eoir
          wget -O eoir_data.zip "$DOWNLOAD_URL"

      - name: Unzip data
        run: |
          unzip -j eoir_data.zip -d inputs_eoir
          rm eoir_data.zip
          mkdir -p tmp

      - name: Process data
        run: |
          set -x
          mkdir -p data
          Rscript scripts/geography_join.R
          Rscript scripts/eoir_appeals.R
          Rscript scripts/eoir_associated_bond.R
          Rscript scripts/eoir_case.R
          Rscript scripts/eoir_court_applications.R
          Rscript scripts/eoir_custody_history.R
          Rscript scripts/eoir_lookups.R
          Rscript scripts/eoir_proceeding.R
          Rscript scripts/eoir_proceedings_charges.R
          Rscript scripts/eoir_case_joins.R

      - name: Update .last_modified
        if: github.event_name != 'pull_request' && inputs.last_modified != '' && inputs.etag != ''
        env:
          LAST_MODIFIED: ${{ inputs.last_modified }}
          ETAG: ${{ inputs.etag }}
        run: |
          # Pass the values through env vars rather than GitHub Actions
          # expression interpolation, so the surrounding quotes around an
          # ETag (e.g. `"abc:0"` from IIS) survive into the file. Inline
          # expression syntax does literal text substitution before bash
          # parses, and `""abc:0""` would collapse to bare `abc:0`, breaking
          # the next run's comparison.
          printf '%s\n%s\n' "$LAST_MODIFIED" "$ETAG" > .last_modified

      - name: Commit and push to branch (release)
        id: commit_release
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git checkout -b eoir-update-$(date +%Y-%m-%d)
          git add data/cases.parquet .last_modified

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "new_data=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update cases data and .last_modified [skip ci]"
            git pull --rebase origin main
            git push --set-upstream origin HEAD
            echo "new_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to PR branch
        id: commit_pr
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/cases.parquet 

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "new_data=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Rebuild data from PR-branch code [skip ci]"
            git push origin "HEAD:$HEAD_REF"
            echo "new_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Aggregate commit outputs
        id: commit
        run: |
          NEW_DATA="${{ steps.commit_release.outputs.new_data || steps.commit_pr.outputs.new_data }}"
          echo "new_data=$NEW_DATA" >> $GITHUB_OUTPUT

      - name: Create pull request
        id: create_pr
        if: github.event_name != 'pull_request' && steps.commit.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "Data update $(date +%Y-%m-%d)" \
            --body "Automated update: new EOIR data detected and processed." \
            --reviewer graemeblair \
            --base main)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Dispatch sanity check workflow
        if: steps.commit.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number || github.event.pull_request.number }}
        run: |
          BRANCH=$(git branch --show-current)
          gh workflow run sanity_check.yaml --ref "$BRANCH" -f pr_number="$PR_NUMBER"

      - name: Generate DDO_BOT App token for deportationdata/checks
        id: dispatch_token
        if: steps.commit.outputs.new_data == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DDO_BOT_APP_ID }}
          private-key: ${{ secrets.DDO_BOT_PRIVATE_KEY }}
          owner: deportationdata
          repositories: checks

      - name: Trigger checks
        if: steps.commit.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch_token.outputs.token }}
        run: |
          BRANCH=$(git branch --show-current)
          gh api repos/deportationdata/checks/dispatches \
            -f event_type=eoir-updated \
            -f "client_payload[branch]=$BRANCH"
