name: Download and process EOIR data

on:
  workflow_call:
    inputs:
      last_modified:
        required: false
        type: string
        default: ""
      etag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      last_modified:
        required: false
        type: string
        default: ""
      etag:
        required: false
        type: string
        default: ""
      download_url:
        required: false
        type: string
        default: "https://fileshare.eoir.justice.gov/EOIR%20Case%20Data.zip"
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'inputs/**'
      - 'renv.lock'
      - '.github/workflows/clean_release_data.yaml'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: clean-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-and-release:
    runs-on: large-runner

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: r-lib/actions/setup-r@v2

      - name: Install V8 system dependency
        run: sudo apt-get update && sudo apt-get install -y libnode-dev

      - uses: r-lib/actions/setup-renv@v2

      # Fails if a hot-path verb stops executing inside DuckDB. duckplyr falls
      # back to plain dplyr silently, so a regression here costs the whole
      # speedup without producing a wrong answer or any visible error.
      - name: Check duckplyr is not falling back
        env:
          DUCKPLYR_FALLBACK_AUTOUPLOAD: "0"
        run: Rscript tests/test_duckplyr_no_fallback.R

      # clean_eoir_cols() repairs only the cells that need it rather than every
      # cell, so its output is pinned against the straightforward version.
      - name: Check clean_eoir_cols semantics are unchanged
        env:
          DUCKPLYR_FALLBACK_AUTOUPLOAD: "0"
        run: Rscript tests/test_clean_eoir_cols.R

      # The six per-application-type decision columns are derived by filtering
      # and joining rather than by one grouped conditional aggregate, and
      # fast_convert() parses datetimes with readr. Both are pinned against
      # their previous implementations.
      - name: Check court-application decisions and fast_convert
        env:
          DUCKPLYR_FALLBACK_AUTOUPLOAD: "0"
        run: Rscript tests/test_court_applications_decisions.R

      # DuckDB does not guarantee the row order an aggregate sees, so every
      # first()/last()/nth() in the pipeline must pass order_by = row_order.
      # Without it the collapses return the wrong row for a handful of cases,
      # and a different handful on each run.
      - name: Check aggregate ordering is explicit
        env:
          DUCKPLYR_FALLBACK_AUTOUPLOAD: "0"
        run: Rscript tests/test_aggregate_ordering.R

      # A column carrying an extra class (glue::glue() returns glue/character)
      # cannot be aggregated as a plain vector, so the grouped collapse falls
      # back to per-group dispatch: 187s vs 0.02s on a 250k-row fixture, and
      # enough to run the real job past its six-hour limit.
      - name: Check collapse inputs are plain columns
        env:
          DUCKPLYR_FALLBACK_AUTOUPLOAD: "0"
        run: Rscript tests/test_collapse_column_types.R

      # eoir_case_joins.R carries a ~180-column frame, so a verb DuckDB cannot
      # translate copies the whole thing in R. replace_na() and recode_values()
      # cost +3GB on a 400k-row fixture, ~35GB on the real table.
      - name: Check the wide join script stays in DuckDB
        env:
          DUCKPLYR_FALLBACK_AUTOUPLOAD: "0"
        run: Rscript tests/test_case_joins_native.R

      - name: Download data
        env:
          DOWNLOAD_URL: ${{ inputs.download_url || 'https://fileshare.eoir.justice.gov/EOIR%20Case%20Data.zip' }}
        run: |
          mkdir -p inputs_eoir
          wget -O eoir_data.zip "$DOWNLOAD_URL"

      - name: Unzip data
        run: |
          unzip -j eoir_data.zip -d inputs_eoir
          rm eoir_data.zip
          mkdir -p tmp

      - name: Process data
        run: |
          # Three consecutive runs died inside eoir_proceeding.R with "The
          # runner has received a shutdown signal" and no R error, which is
          # what a runner looks like when the VM is killed out from under it.
          # Print memory and disk alongside the pipeline so the last line
          # before any such kill says which resource ran out.
          # Bounded so a failed trap can never leave the step waiting on it.
          ( for _ in $(seq 720); do
              free -m | awk '/^Mem:/ {printf "[resources] mem %s/%s MB used", $3, $2}'
              df -BM --output=avail . | tail -1 | awk '{printf ", disk %s avail\n", $1}'
              sleep 20
            done ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

          set -x
          mkdir -p data
          Rscript scripts/geography_join.R
          Rscript scripts/eoir_appeals.R
          Rscript scripts/eoir_associated_bond.R
          Rscript scripts/eoir_case.R
          Rscript scripts/eoir_court_applications.R
          Rscript scripts/eoir_custody_history.R
          Rscript scripts/eoir_lookups.R
          Rscript scripts/eoir_proceeding.R
          Rscript scripts/eoir_proceedings_charges.R
          Rscript scripts/eoir_case_joins.R

      - name: Update .last_modified
        if: github.event_name != 'pull_request' && inputs.last_modified != '' && inputs.etag != ''
        env:
          LAST_MODIFIED: ${{ inputs.last_modified }}
          ETAG: ${{ inputs.etag }}
        run: |
          # Pass the values through env vars rather than GitHub Actions
          # expression interpolation, so the surrounding quotes around an
          # ETag (e.g. `"abc:0"` from IIS) survive into the file. Inline
          # expression syntax does literal text substitution before bash
          # parses, and `""abc:0""` would collapse to bare `abc:0`, breaking
          # the next run's comparison.
          printf '%s\n%s\n' "$LAST_MODIFIED" "$ETAG" > .last_modified

      - name: Commit and push to branch (release)
        id: commit_release
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git checkout -b eoir-update-$(date +%Y-%m-%d)
          git add data/cases.parquet .last_modified

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "new_data=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update cases data and .last_modified [skip ci]"
            git pull --rebase origin main
            git push --set-upstream origin HEAD
            echo "new_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to PR branch
        id: commit_pr
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/cases.parquet 

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "new_data=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Rebuild data from PR-branch code [skip ci]"
            git push origin "HEAD:$HEAD_REF"
            echo "new_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Aggregate commit outputs
        id: commit
        run: |
          NEW_DATA="${{ steps.commit_release.outputs.new_data || steps.commit_pr.outputs.new_data }}"
          echo "new_data=$NEW_DATA" >> $GITHUB_OUTPUT

      - name: Create pull request
        id: create_pr
        if: github.event_name != 'pull_request' && steps.commit.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "Data update $(date +%Y-%m-%d)" \
            --body "Automated update: new EOIR data detected and processed." \
            --reviewer graemeblair \
            --base main)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Dispatch sanity check workflow
        if: steps.commit.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number || github.event.pull_request.number }}
        run: |
          BRANCH=$(git branch --show-current)
          gh workflow run sanity_check.yaml --ref "$BRANCH" -f pr_number="$PR_NUMBER"

      - name: Generate DDO_BOT App token for deportationdata/checks
        id: dispatch_token
        if: steps.commit.outputs.new_data == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DDO_BOT_APP_ID }}
          private-key: ${{ secrets.DDO_BOT_PRIVATE_KEY }}
          owner: deportationdata
          repositories: checks

      - name: Trigger checks
        if: steps.commit.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch_token.outputs.token }}
        run: |
          BRANCH=$(git branch --show-current)
          gh api repos/deportationdata/checks/dispatches \
            -f event_type=eoir-updated \
            -f "client_payload[branch]=$BRANCH"
