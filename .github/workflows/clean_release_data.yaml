name: Download and process EOIR data

on:
  workflow_call:
    inputs:
      last_modified:
        required: false
        type: string
        default: ""
      etag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      last_modified:
        required: false
        type: string
        default: ""
      etag:
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  run-and-release:
    runs-on: large-runner

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      - name: Download data
        run: |
          mkdir -p inputs_eoir
          wget -O eoir_data.zip "https://fileshare.eoir.justice.gov/EOIR%20Case%20Data.zip"

      - name: Unzip data
        run: |
          unzip -j eoir_data.zip -d inputs_eoir
          rm eoir_data.zip
          mkdir -p tmp

      - name: Process data
        run: |
          set -x
          mkdir -p data
          Rscript scripts/geography_join.R
          Rscript scripts/eoir_appeals.R
          Rscript scripts/eoir_associated_bond.R
          Rscript scripts/eoir_case.R
          Rscript scripts/eoir_court_applications.R
          Rscript scripts/eoir_custody_history.R
          Rscript scripts/eoir_lookups.R
          Rscript scripts/eoir_proceeding.R
          Rscript scripts/eoir_proceedings_charges.R
          Rscript scripts/eoir_case_joins.R

      - name: Update .last_modified
        if: inputs.last_modified != '' && inputs.etag != ''
        run: |
          printf '%s\n%s\n' "${{ inputs.last_modified }}" "${{ inputs.etag }}" > .last_modified

      - name: Commit and push to branch
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git checkout -b eoir-update-$(date +%Y-%m-%d)
          git add data/cases.parquet data/cases-no-codes.parquet .last_modified

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "new_data=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update cases data and .last_modified [skip ci]"
            git pull --rebase origin main
            git push --set-upstream origin HEAD
            echo "new_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        id: create_pr
        if: steps.commit.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "Data update $(date +%Y-%m-%d)" \
            --body "Automated update: new EOIR data detected and processed." \
            --reviewer graemeblair \
            --base main)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Dispatch sanity check workflow
        if: steps.create_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sanity_check.yaml \
            -f pr_number="${{ steps.create_pr.outputs.pr_number }}"

      - name: Generate DDO_BOT App token for deportationdata/checks
        id: dispatch_token
        if: steps.commit.outputs.new_data == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DDO_BOT_APP_ID }}
          private-key: ${{ secrets.DDO_BOT_PRIVATE_KEY }}
          owner: deportationdata
          repositories: checks

      - name: Trigger checks
        if: steps.commit.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch_token.outputs.token }}
        run: |
          BRANCH=$(git branch --show-current)
          gh api repos/deportationdata/checks/dispatches \
            -f event_type=eoir-updated \
            -f "client_payload[branch]=$BRANCH"
