name: Check for EOIR data update

on:
  schedule:
    - cron: '0 13 * * *'   # 9:00am ET
    - cron: '0 16 * * *'   # 12:00pm ET
    - cron: '30 22 * * *'  # 6:30pm ET
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      last_modified: ${{ steps.check.outputs.last_modified }}
      etag: ${{ steps.check.outputs.etag }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Last-Modified and ETag headers
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEADERS=$(curl -sI "https://fileshare.eoir.justice.gov/EOIR%20Case%20Data.zip")

          LAST_MODIFIED=$(echo "$HEADERS" | grep -i "^last-modified:" | tr -d '\r' | cut -d' ' -f2-)
          ETAG=$(echo "$HEADERS" | grep -i "^etag:" | tr -d '\r' | cut -d' ' -f2-)

          echo "Remote Last-Modified: $LAST_MODIFIED"
          echo "Remote ETag:          $ETAG"

          STORED_LAST_MODIFIED=""
          STORED_ETAG=""
          if [ -f .last_modified ]; then
            STORED_LAST_MODIFIED=$(sed -n '1p' .last_modified)
            STORED_ETAG=$(sed -n '2p' .last_modified)
          fi

          echo "Stored Last-Modified: $STORED_LAST_MODIFIED"
          echo "Stored ETag:          $STORED_ETAG"

          # Normalize ETag for comparison per RFC 7232: strip optional `W/`
          # weakness prefix and the surrounding double quotes around the
          # opaque-tag. Cloudflare can flip strong (`"x"`) to weak (`W/"x"`)
          # depending on compression / feature settings, and historical
          # stored values may have lost the quotes. Comparing on the bare
          # opaque-tag is robust to both.
          normalize_etag() {
            local v="$1"
            v="${v#W/}"
            v="${v#\"}"
            v="${v%\"}"
            printf '%s' "$v"
          }
          ETAG_NORM=$(normalize_etag "$ETAG")
          STORED_ETAG_NORM=$(normalize_etag "$STORED_ETAG")

          if [ "$LAST_MODIFIED" = "$STORED_LAST_MODIFIED" ] && [ "$ETAG_NORM" = "$STORED_ETAG_NORM" ]; then
            echo "No update detected — skipping download."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip if a data-update PR is already open awaiting merge,
          # so we don't open a duplicate PR each cron run while the previous one sits.
          OPEN=$(gh pr list --state open --base main --json title \
            --jq '[.[] | select(.title | startswith("Data update"))] | length')
          if [ "$OPEN" -gt 0 ]; then
            echo "An open 'Data update' PR already exists — skipping to avoid duplicates."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "changed=true" >> $GITHUB_OUTPUT
          {
            echo "last_modified<<EOF"
            echo "$LAST_MODIFIED"
            echo "EOF"
            echo "etag<<EOF"
            echo "$ETAG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

  process:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/clean_release_data.yaml
    with:
      last_modified: ${{ needs.check.outputs.last_modified }}
      etag: ${{ needs.check.outputs.etag }}
    secrets: inherit
