name: Sanity check data update

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to inspect"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: large-runner
    steps:
      - name: Resolve PR head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ inputs.pr_number }}"
          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo ${{ github.repository }} --json headRefName --jq .headRefName)
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          lfs: true

      - name: Checkout main into main_ref/
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          path: main_ref
          sparse-checkout: |
            data/cases.parquet
          sparse-checkout-cone-mode: false

      - uses: r-lib/actions/setup-r@v2

      - name: Install arrow
        shell: Rscript {0}
        run: |
          install.packages("arrow", repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")

      - name: Run sanity checks
        run: |
          Rscript scripts/sanity_check.R \
            data/cases.parquet \
            main_ref/data/cases.parquet \
            .last_modified \
            sanity_report.md

      - name: Post sticky comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- sanity-check-comment -->"
          if [ ! -s sanity_report.md ]; then
            printf '%s\n## Data sanity check\n\nThe sanity check job failed before producing a report. See the workflow run for details.\n' "$MARKER" > sanity_report.md
          else
            printf '%s\n' "$MARKER" > /tmp/body.md
            cat sanity_report.md >> /tmp/body.md
            mv /tmp/body.md sanity_report.md
          fi

          EXISTING_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id")

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            gh api "repos/${REPO}/issues/comments/${EXISTING_ID}" \
              -X PATCH \
              -F body=@sanity_report.md
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file sanity_report.md
          fi
